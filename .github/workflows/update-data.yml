name: auto-update-data
on:
  schedule:
    - cron: '17 14 * * 1-5'   # 每个工作日 14:17 UTC（美东数据发布后）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FRED series
        run: python3 scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "auto-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/auto.json; then
            git add data/auto.json
            git commit -m "data: auto refresh (FRED)"
            git push
          fi
